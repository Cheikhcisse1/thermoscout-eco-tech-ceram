services:
  - type: web
    name: thermoscout
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: APP_PASSWORD      # à saisir dans le tableau de bord Render (jamais dans Git)
        sync: false
      - key: ANTHROPIC_API_KEY # optionnel : sans clé, le calcul marche mais pas la rédaction IA
        sync: false
      - key: RATE_LIMIT_PER_HOUR
        value: "30"
